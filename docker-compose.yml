services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: order_history
      POSTGRES_PASSWORD: order_history
      POSTGRES_DB: order_history
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_history -d order_history"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
